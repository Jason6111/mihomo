; =========================================================
; OpenClash 超便利节点模板
; 全部机场节点手动选择版
; Game + Spotify 独立分流
; =========================================================

[custom]

enable_rule_generator=true
overwrite_original_rules=true

; =========================================================
; 01. 策略组
; 所有策略组直接显示机场全部节点
; =========================================================

custom_proxy_group=🌐 国外总模式`select`.*`[]DIRECT

custom_proxy_group=👽 AI`select`.*`[]DIRECT

custom_proxy_group=📘 GitHub`select`.*`[]DIRECT

custom_proxy_group=🎮 游戏`select`.*`[]DIRECT

custom_proxy_group=🎵 Spotify`select`.*`[]DIRECT

custom_proxy_group=📡 Telegram`select`.*`[]DIRECT

custom_proxy_group=🎬 流媒体`select`.*`[]DIRECT

custom_proxy_group=🎵 TikTok`select`.*`[]DIRECT

custom_proxy_group=🌍 国外`select`.*`[]DIRECT

custom_proxy_group=🏠 国内`select`[]DIRECT`.*

custom_proxy_group=🐟 漏网之鱼`select`.*`[]DIRECT


; =========================================================
; 02. 核心路由规则集
; =========================================================


; =========================================================
; AI
; =========================================================

ruleset=👽 AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=👽 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=👽 AI,[]DOMAIN-SUFFIX,notebooklm.google.com
ruleset=👽 AI,[]DOMAIN-SUFFIX,notebooklm.google
ruleset=👽 AI,[]DOMAIN-SUFFIX,anthropic.com
ruleset=👽 AI,[]DOMAIN-SUFFIX,claude.ai
ruleset=👽 AI,[]DOMAIN-SUFFIX,huggingface.co
ruleset=👽 AI,[]DOMAIN-KEYWORD,huggingface
ruleset=👽 AI,[]DOMAIN-SUFFIX,grok.com
ruleset=👽 AI,[]DOMAIN-SUFFIX,x.ai
ruleset=👽 AI,[]DOMAIN-SUFFIX,x.com
ruleset=👽 AI,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list


; =========================================================
; GitHub
; =========================================================

ruleset=📘 GitHub,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GitHub.list


; =========================================================
; Game
; Nintendo / Steam / PlayStation / Xbox
; =========================================================

; -------------------------
; Nintendo
; -------------------------

ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo.net
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo.co.jp
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo.jp
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo-europe.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo-europe-sales.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendowifi.net
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendo-switch.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,nintendoswitch.com


; -------------------------
; Steam
; -------------------------

ruleset=🎮 游戏,[]DOMAIN-SUFFIX,steampowered.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,steamcommunity.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,steamcontent.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,steamstatic.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,steamserver.net


; -------------------------
; PlayStation
; -------------------------

ruleset=🎮 游戏,[]DOMAIN-SUFFIX,playstation.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,playstation.net
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,playstationnetwork.com


; -------------------------
; Xbox
; -------------------------

ruleset=🎮 游戏,[]DOMAIN-SUFFIX,xbox.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,xboxlive.com
ruleset=🎮 游戏,[]DOMAIN-SUFFIX,xboxservices.com


; =========================================================
; Spotify
; 必须放在流媒体规则之前
; =========================================================

ruleset=🎵 Spotify,[]DOMAIN-KEYWORD,-spotify-
ruleset=🎵 Spotify,[]DOMAIN-SUFFIX,pscdn.co
ruleset=🎵 Spotify,[]DOMAIN-SUFFIX,scdn.co
ruleset=🎵 Spotify,[]DOMAIN-SUFFIX,spoti.fi
ruleset=🎵 Spotify,[]DOMAIN-SUFFIX,spotify.com
ruleset=🎵 Spotify,[]DOMAIN-SUFFIX,spotifycdn.com
ruleset=🎵 Spotify,[]DOMAIN-SUFFIX,spotifycdn.net


; =========================================================
; Telegram
; =========================================================

ruleset=📡 Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list


; =========================================================
; 流媒体
; Spotify 已在上面优先匹配
; =========================================================

ruleset=🎬 流媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list


; =========================================================
; TikTok
; =========================================================

ruleset=🎵 TikTok,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/TikTok.list


; =========================================================
; 国外
; =========================================================

ruleset=🌍 国外,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list


; =========================================================
; 国内
; =========================================================

ruleset=🏠 国内,[]GEOIP,CN


; =========================================================
; 最终兜底
; =========================================================

ruleset=🐟 漏网之鱼,[]MATCH

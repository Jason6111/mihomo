; =========================================================
; OpenClash 超便利节点模板 (Fzlwhyc Edition)
; 游戏 + Spotify 分流版
; =========================================================

[custom]

enable_rule_generator=true
overwrite_original_rules=true

; =========================================================
; 01. 锁地区模式 (地区内节点自动择优而行)
; =========================================================

custom_proxy_group=🌐 国外总模式`select`[]♻️ 全部-自动`[]🌏 亚太-自动`[]🇨🇳 港台-自动`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇯🇵 日本-自动`[]🇸🇬 新加坡-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]🔥 热门-手动`[]❄️ 冷门-手动`[]DIRECT

; =========================================================
; 02. 常用功能组
; =========================================================

custom_proxy_group=👽 AI`select`[]🌐 国外总模式`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇹🇼 台湾-自动`[]🇰🇷 韩国-自动`[]🇸🇬 新加坡-自动`[]🔥 热门-手动`[]❄️ 冷门-手动

custom_proxy_group=📘 GitHub`select`[]🌐 国外总模式`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]🔥 热门-手动`[]❄️ 冷门-手动

; 游戏独立分流
custom_proxy_group=🎮 游戏`select`[]🌐 国外总模式`[]🇯🇵 日本-自动`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇸🇬 新加坡-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]🔥 热门-手动`[]❄️ 冷门-手动`[]DIRECT

; Spotify 独立分流
custom_proxy_group=🎵 Spotify`select`[]🌐 国外总模式`[]🇯🇵 日本-自动`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇸🇬 新加坡-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]🔥 热门-手动`[]❄️ 冷门-手动`[]DIRECT

custom_proxy_group=📡 Telegram`select`[]🌐 国外总模式`[]🇸🇬 新加坡-自动`[]🇭🇰 香港-自动`[]🇹🇼 台湾-自动`[]🇯🇵 日本-自动`[]🇺🇸 美国-自动`[]🇰🇷 韩国-自动`[]🔥 热门-手动`[]❄️ 冷门-手动

custom_proxy_group=🎬 流媒体`select`[]🌐 国外总模式`[]🇨🇳 港台-自动`[]🇹🇼 台湾-自动`[]🇭🇰 香港-自动`[]🇸🇬 新加坡-自动`[]🇯🇵 日本-自动`[]🇰🇷 韩国-自动`[]🇺🇸 美国-自动`[]🔥 热门-手动`[]❄️ 冷门-手动

